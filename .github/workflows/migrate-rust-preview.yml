name: Finish renaming the existing Rust preview
on:
  push:
    branches: [rust-rewrite]
    paths: ['.github/workflows/migrate-rust-preview.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the new release and remove the old release entry
        shell: bash
        run: |
          set -euo pipefail
          old=v0.2.0
          new=v0.2.0-rust-preview
          asset=OfficeGitSync-v0.2.0-windows-x64.exe
          expected=e89b4caedc871dcbe0967e63ade390a969eab17dfbcb5cdd22da5c0b6e5936fd
          work=$(mktemp -d)
          gh release view "$old" --json body > "$work/old-notes.json"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$new" --jq .id)
          # Restore the exact body, including the original trailing-newline state.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input "$work/old-notes.json" >/dev/null
          gh release view "$new" --json isPrerelease,isDraft,body \
            --jq 'select(.isPrerelease and (.isDraft | not)) | {body}' \
            | jq -cS . > "$work/new-notes.json"
          jq -cS . "$work/old-notes.json" > "$work/expected-notes.json"
          cmp "$work/expected-notes.json" "$work/new-notes.json"
          gh release download "$new" --pattern "$asset" --dir "$work"
          printf '%s  %s\n' "$expected" "$work/$asset" | sha256sum -c -
          gh release delete "$old" --yes
