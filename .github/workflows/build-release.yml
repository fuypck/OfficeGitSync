name: Auto Build Windows Release

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的标签（如 v0.1.0）时触发自动化构建

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dulwich watchdog pystray pillow pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "OfficeGitSync_v0.1.0" git_sync.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OfficeGitSync_v0.1.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
