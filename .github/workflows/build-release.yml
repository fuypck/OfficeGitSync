name: Rust Windows Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check for a published asset
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $preview = $tag.EndsWith('-rust-preview')
          $asset = if ($preview) { "OfficeGitSync-${tag}-windows-x64.exe" } else { "OfficeGitSync_${tag}.exe" }
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "preview=$($preview.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $release = gh release view $tag --json assets,isDraft,isPrerelease 2>$null
          $exists = $false
          if ($LASTEXITCODE -eq 0) {
            $release = $release | ConvertFrom-Json
            $exists = @($release.assets | Where-Object { $_.name -eq $asset }).Count -gt 0
            if ($exists -and ($release.isDraft -or $release.isPrerelease -ne $preview)) {
              throw 'Existing release asset has an unexpected publication state.'
            }
          }
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.exists != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.exists != 'true'
      - name: Test
        if: steps.release.outputs.exists != 'true'
        run: cargo test --locked
      - name: Build
        if: steps.release.outputs.exists != 'true'
        run: cargo build --locked --release
        env:
          OFFICEGITSYNC_VERSION: ${{ github.ref_name }}
      - name: Name and hash the release binary
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          Copy-Item target/release/OfficeGitSync.exe $env:RELEASE_ASSET
          Get-FileHash -Algorithm SHA256 $env:RELEASE_ASSET
      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OfficeGitSync ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.preview }}
          files: ${{ steps.release.outputs.asset }}
          body_path: ${{ github.ref_name == 'v0.2.1-rust-preview' && 'docs/releases/v0.2.1.md' || '' }}
          fail_on_unmatched_files: true
          overwrite_files: false
