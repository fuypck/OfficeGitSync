name: Auto Build Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    # 🔑 关键解决部分：显式授予写入权限，允许创建 Release 和上传文件
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dulwich watchdog pystray pillow pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "OfficeGitSync_v0.1.1" git_sync.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OfficeGitSync_v0.1.1.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
