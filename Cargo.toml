[package]
name = "officegitsync"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "OfficeGitSync"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
